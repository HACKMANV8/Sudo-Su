                    <h2 id="modalTitle">Welcome Back</h2>
                </div>
                
                <div id="errorMsg" class="error-msg"></div>
                <div id="successMsg" class="success-msg"></div>

                <form id="authForm">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>

                    <div id="passwordGroup" class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>

                    <div id="confirmPasswordGroup" class="input-group" style="display: none;">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="••••••••">
                    </div>

                    <button type="submit" id="submitBtn" class="submit-btn">
                        <span id="submitText">Login</span>
                        <div id="submitLoader" class="loader" style="display: none;"></div>
                    </button>
                </form>

                <div class="modal-footer">
                    <button type="button" id="toggleAuthBtn" class="link-btn">
                        Don't have an account? <span>Sign Up</span>
                    </button>
                    <button type="button" id="forgotPasswordBtn" class="link-btn">
                        Forgot password?
                    </button>
                </div>
            </div>
        </div>

        <div id="chatInterface" class="chat-interface" style="display: none;">
            <div class="sidebar">
                <button id="newChatBtn" class="new-chat-btn">
                    <span>➕</span> New Chat
                </button>
                <div id="chatsList" class="chats-list">
                    <div class="loading-text">Loading chats...</div>
                </div>
            </div>

            <div class="chat-area">
                <div id="messagesContainer" class="messages-container">
                    <div class="empty-state">Select a chat or create a new one to start</div>
                </div>

                <div class="input-area">
                    <div class="url-checkbox-container">
                        <label class="url-checkbox-label">
                            <input type="checkbox" id="includeUrlCheckbox" checked>
                            <span class="url-text" id="urlText">Include current page URL</span>
                        </label>
                    </div>
                    <div class="input-area-row">
                        <input type="text" id="messageInput" placeholder="Type your message..." />
                        <button id="sendBtn" class="send-btn">
                            <span>→</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="popup.js"></script>
</body>
</html>
